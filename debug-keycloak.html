<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keycloak 调试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        .debug-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .info {
            background-color: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        .warning {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
        pre {
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
        }
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid #007bff;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <h1>Keycloak 调试页面</h1>
    
    <div class="debug-section">
        <h3>环境配置检查</h3>
        <div id="env-status" class="status info">检查中...</div>
        <div id="env-details"></div>
    </div>

    <div class="debug-section">
        <h3>Keycloak 连接测试</h3>
        <div id="connection-status" class="status info">未测试</div>
        <button onclick="testKeycloakConnection()">测试连接</button>
        <div id="connection-details"></div>
    </div>

    <div class="debug-section">
        <h3>认证状态</h3>
        <div id="auth-status" class="status info">未检查</div>
        <button onclick="checkAuthStatus()">检查认证状态</button>
        <button onclick="initKeycloak()">初始化 Keycloak</button>
        <button onclick="testLogin()">测试登录</button>
        <div id="auth-details"></div>
    </div>

    <div class="debug-section">
        <h3>调试日志</h3>
        <button onclick="clearLogs()">清空日志</button>
        <div id="debug-logs"></div>
    </div>

    <div class="debug-section">
        <h3>操作</h3>
        <button onclick="goToApp()">进入应用</button>
        <button onclick="location.reload()">刷新页面</button>
    </div>

    <script>
        let logs = [];

        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            logs.push({ timestamp, message, type });
            updateLogs();
            console.log(`[${timestamp}] ${message}`);
        }

        function updateLogs() {
            const logsDiv = document.getElementById('debug-logs');
            logsDiv.innerHTML = logs.map(log => 
                `<div class="log-entry">[${log.timestamp}] ${log.message}</div>`
            ).join('');
        }

        function clearLogs() {
            logs = [];
            updateLogs();
        }

        function updateStatus(elementId, type, message) {
            const element = document.getElementById(elementId);
            element.className = `status ${type}`;
            element.textContent = message;
        }

        function checkEnvironment() {
            log('检查环境变量配置...');
            
            const keycloakUrl = import.meta.env?.VITE_KEYCLOAK_URL || '未设置';
            const keycloakRealm = import.meta.env?.VITE_KEYCLOAK_REALM || '未设置';
            const keycloakClient = import.meta.env?.VITE_KEYCLOAK_CLIENT_ID || '未设置';

            const details = `
                <p><strong>VITE_KEYCLOAK_URL:</strong> ${keycloakUrl}</p>
                <p><strong>VITE_KEYCLOAK_REALM:</strong> ${keycloakRealm}</p>
                <p><strong>VITE_KEYCLOAK_CLIENT_ID:</strong> ${keycloakClient}</p>
                <p><strong>当前域名:</strong> ${window.location.origin}</p>
            `;

            document.getElementById('env-details').innerHTML = details;

            if (keycloakUrl !== '未设置' && keycloakRealm !== '未设置' && keycloakClient !== '未设置') {
                updateStatus('env-status', 'success', '环境变量配置完整');
                log('环境变量配置检查通过');
                return true;
            } else {
                updateStatus('env-status', 'error', '环境变量配置不完整');
                log('环境变量配置不完整', 'error');
                return false;
            }
        }

        async function testKeycloakConnection() {
            log('测试 Keycloak 服务器连接...');
            updateStatus('connection-status', 'info', '测试中...');

            const keycloakUrl = import.meta.env?.VITE_KEYCLOAK_URL;
            const keycloakRealm = import.meta.env?.VITE_KEYCLOAK_REALM;

            if (!keycloakUrl || !keycloakRealm) {
                updateStatus('connection-status', 'error', '环境变量未配置');
                log('无法测试连接：环境变量未配置', 'error');
                return;
            }

            try {
                const realmUrl = `${keycloakUrl}/realms/${keycloakRealm}`;
                log(`尝试连接: ${realmUrl}`);
                
                const response = await fetch(realmUrl);
                
                if (response.ok) {
                    const realmInfo = await response.json();
                    updateStatus('connection-status', 'success', 'Keycloak 服务器连接成功');
                    log('Keycloak 服务器连接成功');
                    
                    document.getElementById('connection-details').innerHTML = `
                        <p><strong>Realm:</strong> ${realmInfo.realm}</p>
                        <p><strong>Public Key:</strong> ${realmInfo.public_key ? '已获取' : '未获取'}</p>
                        <p><strong>响应状态:</strong> ${response.status}</p>
                    `;
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                updateStatus('connection-status', 'error', `连接失败: ${error.message}`);
                log(`Keycloak 连接失败: ${error.message}`, 'error');
                
                document.getElementById('connection-details').innerHTML = `
                    <p><strong>错误:</strong> ${error.message}</p>
                    <p><strong>建议:</strong> 检查 Keycloak 服务器是否运行，URL 是否正确</p>
                `;
            }
        }

        async function initKeycloak() {
            log('初始化 Keycloak...');
            updateStatus('auth-status', 'info', '初始化中...');

            try {
                // 这里需要实际的 Keycloak 初始化代码
                // 由于这是静态 HTML 页面，我们只能模拟
                log('注意：这是调试页面，无法直接初始化 Keycloak');
                log('请在实际应用中查看控制台日志');
                
                updateStatus('auth-status', 'warning', '请在实际应用中测试');
                
                document.getElementById('auth-details').innerHTML = `
                    <p><strong>提示:</strong> 请在实际应用中进行 Keycloak 初始化测试</p>
                    <p><strong>检查项目:</strong></p>
                    <ul>
                        <li>打开浏览器开发者工具</li>
                        <li>查看控制台日志</li>
                        <li>检查网络请求</li>
                        <li>验证 Keycloak 配置</li>
                    </ul>
                `;
            } catch (error) {
                updateStatus('auth-status', 'error', `初始化失败: ${error.message}`);
                log(`Keycloak 初始化失败: ${error.message}`, 'error');
            }
        }

        function checkAuthStatus() {
            log('检查认证状态...');
            updateStatus('auth-status', 'info', '检查中...');
            
            // 检查 URL 参数，看是否有认证相关的参数
            const urlParams = new URLSearchParams(window.location.search);
            const hasAuthParams = urlParams.has('code') || urlParams.has('state') || urlParams.has('session_state');
            
            if (hasAuthParams) {
                updateStatus('auth-status', 'info', '检测到认证参数');
                log('URL 中检测到认证参数');
                
                const authDetails = [];
                for (const [key, value] of urlParams.entries()) {
                    authDetails.push(`<p><strong>${key}:</strong> ${value}</p>`);
                }
                
                document.getElementById('auth-details').innerHTML = `
                    <p><strong>URL 参数:</strong></p>
                    ${authDetails.join('')}
                `;
            } else {
                updateStatus('auth-status', 'info', '未检测到认证参数');
                log('URL 中未检测到认证参数');
                
                document.getElementById('auth-details').innerHTML = `
                    <p>当前 URL 中没有认证相关参数</p>
                    <p>这可能意味着：</p>
                    <ul>
                        <li>用户尚未进行认证</li>
                        <li>认证流程尚未开始</li>
                        <li>已经完成认证并清理了参数</li>
                    </ul>
                `;
            }
        }

        function testLogin() {
            log('准备测试登录...');
            alert('请在实际应用中测试登录功能。这个调试页面主要用于检查配置和连接。');
        }

        function goToApp() {
            window.location.href = '/';
        }

        // 页面加载时自动检查环境
        window.addEventListener('load', () => {
            log('调试页面加载完成');
            checkEnvironment();
            checkAuthStatus();
        });
    </script>
</body>
</html>
